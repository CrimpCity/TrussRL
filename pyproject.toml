[project]
name = "trussRL"
description = "RLVR for 2D single span truss"
version = "1.0.0"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.13,<3.14"

dependencies = [
    "matplotlib>=3.11.0",
    # numpy <2.5 cap comes from numba 0.65.0 (pinned by vLLM); revisit when
    # vLLM's numba pin moves.
    "numpy>=2.4.6,<2.5",
    "openseespy>=3.8.0.0",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "scipy>=1.18.0",
    "typer>=0.27.0",
]

[project.scripts]
trussrl-pipeline = "trussRL.cli.pipeline:main"
trussrl-calibrate = "trussRL.cli.calibrate:main"
trussrl-model-check = "trussRL.cli.model_check:main"
trussrl-reward-bench = "trussRL.cli.reward_bench:main"
trussrl-train-roster = "trussRL.cli.train_roster:main"
trussrl-rollout-gate = "trussRL.cli.rollout_gate:main"

[project.optional-dependencies]
training = [
    "accelerate>=1.14.0",
    "huggingface-hub>=1.24.0",
    "numba>=0.65.0",
    "peft>=0.19.1",
    "torch>=2.11.0",
    "transformers>=5.14.1",
    "trl>=1.9.0",
    "vllm>=0.25; platform_system == 'Linux'",
]

[dependency-groups]
dev = [
    "isort>=8.0.1",
    "mypy>=2.3.0",
    "pandas-stubs",
    "pre-commit>=4.6.0",
    "pytest-asyncio>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "taplo>=0.9.3",
    "tomlkit>=0.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trussRL"]


[tool.uv]
package = true

[tool.ruff]
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "build",
    "node_modules",
    "site-packages",
    "venv",
    "tests",
]

[tool.ruff.lint]
ignore = ["D100", "D104", "D211", "D213"]
fixable = ["ALL"]

[tool.mypy]
strict = true
disallow_untyped_defs = true
disallow_untyped_decorators = false
exclude = ["^build/", "^dist/", "^tests/"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
files = ["src/trussRL", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["rich.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openseespy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["huggingface_hub.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["accelerate.*", "numba.*", "peft.*", "torch.*", "vllm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["transformers.*", "trl.*"]
ignore_missing_imports = true
follow_imports = "skip"
