[project]
name = "trussRL"
description = "RLVR for 2D single span truss"
version = "1.0.0"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.12,<3.13"

dependencies = [
    "matplotlib>=3.11.0",
    "numpy>=2.5.1",
    "openseespy>=3.8.0.0",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "scipy>=1.18.0",
    "typer>=0.27.0",
]

# RL deps (torch/vllm/trainer) land here at Phase 3; only trussRL.training may import them.
[project.optional-dependencies]
training = []

[dependency-groups]
dev = [
    "isort>=8.0.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",
    "pytest-asyncio>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "taplo>=0.9.3",
    "tomlkit>=0.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trussRL"]


[tool.uv]
package = true

[tool.ruff]
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "build",
    "node_modules",
    "site-packages",
    "venv",
    "tests",
]

[tool.ruff.lint]
ignore = ["D100", "D104", "D211", "D213"]
fixable = ["ALL"]

[tool.mypy]
disallow_untyped_defs = true
disallow_untyped_decorators = false
exclude = ["^build/", "^dist/", "^tests/"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
packages = ["trussRL"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["rich.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
