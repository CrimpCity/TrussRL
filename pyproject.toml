[project]
name = "trussRL"
description = "RLVR for 2D single span truss"
version = "1.0.0"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.12,<3.13"

dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "scipy>=1.17.1",
    "typer>=0.26.8",
]


[dependency-groups]
dev = [
    "isort>=8.0.1",
    "mypy>=1.19.1",
    "pre-commit>=4.5.0",
    "pytest-asyncio>=1.3.0",
    "pytest>=9.0.2",
    "ruff>=0.15.5",
    "taplo>=0.9.3",
    "tomlkit>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trussRL"]


[tool.uv]
package = true

[tool.ruff]
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "build",
    "node_modules",
    "site-packages",
    "venv",
    "tests",
]

[tool.ruff.lint]
ignore = ["D100", "D104", "D211", "D213"]
fixable = ["ALL"]

[tool.mypy]
disallow_untyped_defs = true
disallow_untyped_decorators = false
exclude = ["^build/", "^dist/", "^tests/"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
packages = ["trussRL"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["rich.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
